name: Render I See You Reel

on:
  push:
    paths:
      - 'reel-requests/**/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq
      - name: Render pending requests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            mapfile -t requests < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'reel-requests/**/*.json' | sort -u)
          else
            mapfile -t requests < <(find reel-requests -type f -name '*.json' | sort)
          fi
          if [ "${#requests[@]}" -eq 0 ]; then
            echo "No Reel requests found."
            exit 0
          fi
          for request in "${requests[@]}"; do
            bash github-reel-renderer/render-reel.sh "$request"
          done
      - name: Commit rendered Reels
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- reels)" ]; then
            echo "No new Reel output."
            exit 0
          fi
          git config user.name "I See You Reel Renderer"
          git config user.email "actions@users.noreply.github.com"
          git add reels
          git commit -m "Render approved I See You Reel"
          git push
